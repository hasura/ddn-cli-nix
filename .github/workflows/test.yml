name: Test

on:
  push:
    branches:
      - main
      - 'v*'
  pull_request:

jobs:
  tests:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4.2.2

      - name: Install Nix ❄
        uses: DeterminateSystems/nix-installer-action@v4

      - name: run checks 🔨
        run: nix flake check
